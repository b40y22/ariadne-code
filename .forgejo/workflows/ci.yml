name: CI

on:
  push:
    branches: [main]
  pull_request:

# Forgejo runs this file; GitHub runs .github/workflows/ci.yml. They differ because code.forgejo.org mirrors
# actions/checkout but not setup-php or setup-node, and the runner image (node:20-bookworm) already has Node.
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP 8.5 and Composer
        run: ci/install-php.sh

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: Tests
        run: vendor/bin/phpunit

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Node version
        run: node -v && npm -v

      - name: Install dependencies
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
