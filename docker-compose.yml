services:
  php:
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - .:/app

  api:
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: php -S 0.0.0.0:8080 -t public public/index.php
    ports:
      - "${API_PORT:-8090}:8080"
    volumes:
      - .:/app

  web:
    image: node:22-alpine
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app/web
    environment:
      HOME: /tmp
      API_TARGET: http://api:8080
    command: npm run dev
    ports:
      - "${WEB_PORT:-5180}:5173"
    volumes:
      - .:/app
    depends_on:
      - api
